name: Build and Publish Rock (OCI)

on:
  push:
    branches:
      - 'master'
      - 'main'
  workflow_dispatch:

jobs:
  rock:
    name: Build and Push Rock Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Version
        run: |
          TAG=$(cat ./VERSION | tr -d '\r\n')
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Rock
        uses: canonical/craft-actions/rockcraft-pack@d2add174925f9bca7b0a826010c8e1ce2a4bbc3d # v1.0.0
        id: rockcraft

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Rock to GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/nspect"
          ROCK_FILE="${{ steps.rockcraft.outputs.rock }}"

          skopeo --insecure-policy copy \
            oci-archive:"${ROCK_FILE}" \
            docker://${IMAGE}:${{ env.TAG }}

          skopeo --insecure-policy copy \
            oci-archive:"${ROCK_FILE}" \
            docker://${IMAGE}:latest
